# DNS interne de l'entreprise (zone entreprise.local)
# Resout les sous-domaines vers le reverse proxy (172.30.10.10)
no-resolv
server=1.1.1.1
server=8.8.8.8

address=/wordpress.entreprise.local/172.30.10.10
address=/app.entreprise.local/172.30.10.10
address=/entreprise.local/172.30.10.10

# Plage DHCP de demonstration pour le segment technique
dhcp-range=172.30.10.100,172.30.10.150,12h
log-queries
log-dhcp
